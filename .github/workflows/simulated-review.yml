name: Simulated Holonic governance review

# Test only: the local simulator returns scripted results, not governance decisions.
on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    if: github.repository == 'scottswindell-hub/governance-cicd-test'
    runs-on: ubuntu-latest
    # A review takes minutes. The endpoint starts it and answers at once; this job then polls for the outcome.
    timeout-minutes: 20
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Start and onboard simulator
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/start_simulator.py
      - name: Holonic governance review
        env:
          API_KEY: simulation-only-key
          VERIFY_URL: "http://127.0.0.1:18765/verify-checks"
          OWNER: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status() {   # state (pending|success|failure|error), description (GitHub keeps 140 characters)
            gh api --method POST "repos/${OWNER}/${REPO}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context="Holonic / Simulated review" -f description="${2:0:140}" >/dev/null
          }
          status pending "Holonic review running"
          # The PR's unified diff (read-only API; no PR code is checked out or executed).
          matches_pr() {
            gh api "repos/${OWNER}/${REPO}/pulls/${PR_NUMBER}" --jq '[.head.sha, .base.sha] | @tsv' | \
              grep -Fx -- "$(printf '%s\t%s' "${HEAD_SHA}" "${BASE_SHA}")" >/dev/null
          }
          if ! matches_pr; then
            status error "PR commits changed before diff retrieval"
            exit 1
          fi
          if ! DIFF=$(gh api "repos/${OWNER}/${REPO}/pulls/${PR_NUMBER}" -H "Accept: application/vnd.github.v3.diff"); then
            status error "Could not obtain the PR diff"
            exit 1
          fi
          if [ -z "${DIFF}" ]; then
            status error "PR diff is empty or unavailable"
            exit 1
          fi
          if ! matches_pr; then
            status error "PR commits changed during diff retrieval"
            exit 1
          fi
          if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            status error "Missing PR commit identity"
            exit 1
          fi
          WORK_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/holonic-review.XXXXXXXX")
          chmod 700 "${WORK_DIR}"
          trap 'rm -rf -- "${WORK_DIR}"' EXIT
          jq -n \
            --arg pn "${PR_NUMBER}" --arg title "${PR_TITLE}" --arg owner "${OWNER}" --arg repo "${REPO}" \
            --arg sha "${HEAD_SHA}" --arg base "${BASE_SHA}" --arg diff "${DIFF}" --arg key "${API_KEY}" \
            '{mode: "start", pull_request_number: ($pn|tonumber), pull_request_title: $title, owner: $owner,
              repo: $repo, sha: $sha, base_sha: $base, diff: $diff, api_key: $key}' > "${WORK_DIR}/start.json"
          CODE=$(curl -sS -m 60 -o "${WORK_DIR}/started.json" -w '%{http_code}' -X POST "${VERIFY_URL}" \
                 -H 'Content-Type: application/json' --data-binary @"${WORK_DIR}/start.json" || echo 000)
          echo "start: HTTP ${CODE}"
          REVIEW_ID=$(jq -r '.review_id // empty' "${WORK_DIR}/started.json" 2>/dev/null || true)

          # Only an explicit DONE + PASS is a success; every other outcome is reported as failure or error.
          STATE=error; RESULT="The review couldn't be started (HTTP ${CODE})"
          if [ "${CODE}" = "202" ] && [ -n "${REVIEW_ID}" ]; then
            jq -n --arg id "${REVIEW_ID}" --arg key "${API_KEY}" '{mode: "status", review_id: $id, api_key: $key}' \
              > "${WORK_DIR}/poll.json"
            RESULT="The review didn't finish within 15 minutes"
            for _ in $(seq 1 60); do
              sleep 15
              POLL_CODE=$(curl -sS -m 30 -o "${WORK_DIR}/status.json" -w '%{http_code}' -X POST "${VERIFY_URL}" \
                -H 'Content-Type: application/json' --data-binary @"${WORK_DIR}/poll.json") || continue
              [ "${POLL_CODE}" = 200 ] || continue
              case "$(jq -r '.status // empty' "${WORK_DIR}/status.json" 2>/dev/null || true)" in
                DONE)
                  RESULT=$(jq -r '.decision // "ERROR"' "${WORK_DIR}/status.json")
                  STATE=failure; [ "${RESULT}" = "PASS" ] && STATE=success
                  break ;;
                ERROR)
                  RESULT="The review couldn't complete: $(jq -r '.reason // "unknown reason"' "${WORK_DIR}/status.json")"
                  break ;;
              esac
            done
          fi
          if [ "${STATE}" = success ] && ! matches_pr; then
            STATE=error; RESULT="PR commits changed during review"
          fi
          if [ -n "${API_KEY}" ]; then RESULT=${RESULT//"${API_KEY}"/[redacted]}; fi
          echo "result: ${STATE}: ${RESULT}"
          status "${STATE}" "${RESULT}"
          gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" \
            --body "Simulated Holonic review (scripted, not governance): **${RESULT}**" >/dev/null 2>&1 || true
          [ "${STATE}" = "success" ]
